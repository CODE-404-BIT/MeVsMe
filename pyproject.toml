[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-bet-model"
version = "0.1.0"
description = "Zero-cost football betting analytics engine"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0",
  "pandas>=2.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cloud = ["Flask>=3.1,<4", "gunicorn>=23,<24", "psycopg[binary]>=3.2,<4"]

[project.scripts]
betmodel = "betmodel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betmodel = ["templates/*.j2", "templates/*.html", "static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
